global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: "cloud-network-monitor"
    static_configs:
      # Port 9100 is already occupied by a host service on the development PC.
      - targets: ["127.0.0.1:9200"]
        labels:
          tier: "monitoring"
          node: "network-exporter"
